<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bodka Yuva Sena</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f3fa;color:#211b2d}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer}.p{background:#6d3fd1;color:white;border:0}.d{background:#ffecef;color:#b22}.s{background:#e8f7ef;color:#16734d}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 15px #0001;margin:12px 0}.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.nav{display:flex;gap:8px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.login{max-width:400px;margin:12vh auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.hide{display:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.box{background:white;padding:22px;border-radius:15px;width:min(620px,100%)}label{display:block;font-weight:bold;margin:9px 0 4px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.pill{padding:5px 9px;border-radius:20px;background:#eee;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.table{min-width:800px}.wrap{padding:10px}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://ztvkybdluwtsxopmpwxq.supabase.co',K='sb_publishable_CwxipNGfHRYaaTkvGkh_GQ_jo-n4oc0',sb=supabase.createClient(U,K);let user=null,festival=null,year=2026,data={income:[],expenses:[]},channel=null;const eid=()=>festival==='navratri'?'1ae039a3-b21b-4b3d-a777-87d83838c592':'8b628047-1c33-4670-86b9-a6eaafaf2ae5',money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(x){alert(x)}function loginView(){app.innerHTML='<div class="login card"><h1>🪔 Bodka Yuva Sena</h1><p>Secure Festival Accounting</p><label>Account</label><input value="Bodka Yuva Sena — Admin" readonly><label>Password</label><input id="pw" type="password" placeholder="Enter password"><button class="p" style="width:100%;margin-top:12px" onclick="login()">Sign In</button><button style="width:100%;margin-top:10px" onclick="forgotPassword()">Forgot Password?</button><p style="font-size:12px;color:#666;text-align:center">Password reset link will be sent to the registered admin email.</p></div>'}async function login(){let p=document.getElementById('pw').value;if(!p)return toast('Enter password');let r=await sb.auth.signInWithPassword({email:'pinakinpatel29092000@gmail.com',password:p});if(r.error)return toast('Incorrect password or account not configured');user=r.data.user;chooseView()}async function forgotPassword(){let r=await sb.auth.resetPasswordForEmail('pinakinpatel29092000@gmail.com',{redirectTo:'https://bodka-yuva-sena-ochre.vercel.app'});if(r.error)return toast('Password reset email could not be sent: '+r.error.message);toast('Password reset link email par mokli didhi chhe. Email ma aaveli link open karo.')}function recoveryView(){app.innerHTML='<div class="login card"><h1>🔐 Set New Password</h1><p>Enter your new Bodka Yuva Sena admin password.</p><label>New Password</label><input id="npw" type="password" placeholder="New password"><label>Confirm Password</label><input id="cpw" type="password" placeholder="Confirm password"><button class="p" style="width:100%;margin-top:12px" onclick="updatePassword()">Update Password</button></div>'}async function updatePassword(){let p=document.getElementById('npw').value,c=document.getElementById('cpw').value;if(!p||p.length<6)return toast('Password minimum 6 characters');if(p!==c)return toast('Passwords do not match');let r=await sb.auth.updateUser({password:p});if(r.error)return toast('Password update failed: '+r.error.message);toast('Password successfully updated. Have login karo.');await sb.auth.signOut();loginView()}function chooseView(){app.innerHTML='<div class="wrap"><div class="card"><h1>Bodka Yuva Sena</h1><p>Select Festival</p><div class="grid"><button class="p" onclick="openFest(\'ganesh\')">🪔 Ganesh Utsav</button><button class="p" onclick="openFest(\'navratri\')">🔱 Navratri</button></div><button onclick="logout()" style="margin-top:15px">Sign out</button></div></div>'}async function openFest(f){festival=f;await load();render();realtime()}async function load(){let [a,b]=await Promise.all([sb.from('income').select('*').eq('event_id',eid()).eq('festival_year',year).order('created_at',{ascending:false}),sb.from('expenses').select('*').eq('event_id',eid()).eq('festival_year',year).order('created_at',{ascending:false})]);if(a.error||b.error)return toast((a.error||b.error).message);data.income=(a.data||[]).map(x=>({id:x.id,name:x.full_name,mobile:x.mobile||'',amount:+x.amount,mode:x.payment_method||'',date:x.paid_date||String(x.created_at).slice(0,10),receipt:x.receipt_number||'',status:x.status||(x.paid?'Paid':'Unpaid'),notes:x.note||''}));data.expenses=(b.data||[]).map(x=>({id:x.id,cat:x.category||'',desc:x.description||'',amount:+x.amount,paid:x.paid_by||'',date:x.expense_date||'',notes:x.note||''}))}function realtime(){if(channel)sb.removeChannel(channel);channel=sb.channel('bodka-live').on('postgres_changes',{event:'*',schema:'public',table:'income',filter:'event_id=eq.'+eid()},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'expenses',filter:'event_id=eq.'+eid()},async()=>{await load();render()}).subscribe()}function render(){app.innerHTML='<div class="wrap"><div class="top"><div><h1>Bodka Yuva Sena</h1><b>'+(festival==='ganesh'?'Ganesh Utsav':'Navratri')+' '+year+'</b></div><button onclick="chooseView()">Switch Festival</button></div><div class="nav card"><button onclick="dashboard()">Dashboard</button><button onclick="incomePage()">Fado / Income</button><button onclick="expensePage()">Expenses</button><button onclick="logout()">Logout</button></div><div id="page"></div></div>';dashboard()}function dashboard(){let inc=data.income.reduce((a,x)=>a+x.amount,0),exp=data.expenses.reduce((a,x)=>a+x.amount,0),pending=data.income.filter(x=>x.status!=='Paid').reduce((a,x)=>a+x.amount,0);page.innerHTML='<div class="grid"><div class="card"><small>Total Fado</small><h2>'+money(inc)+'</h2></div><div class="card"><small>Expenses</small><h2>'+money(exp)+'</h2></div><div class="card"><small>Balance</small><h2>'+money(inc-exp)+'</h2></div><div class="card"><small>Pending Fado</small><h2>'+money(pending)+'</h2></div></div><div class="card"><h2>Recent Fado</h2>'+incomeTable(true)+'</div>'}function incomePage(){page.innerHTML='<div class="card"><div class="top"><h2>Fado / Income</h2><button class="p" onclick="incomeModal()">＋ Add Fado</button></div>'+incomeTable()+'</div>'}function incomeTable(short){let a=data.income;if(short)a=a.slice(0,8);return '<div style="overflow:auto"><table class="table"><tr><th>Name</th><th>Mobile</th><th>Amount</th><th>Status</th><th>Receipt</th><th>WhatsApp</th><th>Action</th></tr>'+a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.mobile)+'</td><td>'+money(x.amount)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+esc(x.receipt)+'</td><td><button class="s" onclick="wa(\''+x.id+'\')">WhatsApp</button></td><td><button onclick="incomeModal(\''+x.id+'\')">Edit</button> <button class="d" onclick="delRec(\'income\',\''+x.id+'\')">Delete</button></td></tr>').join('')+'</table></div>'}function incomeModal(id){let x=id?data.income.find(r=>r.id===id):null;app.insertAdjacentHTML('beforeend','<div class="modal"><div class="box"><h2>'+(x?'Edit':'Add')+' Fado</h2><div class="form"><div><label>Name</label><input id="n" value="'+esc(x?.name||'')+'"></div><div><label>Mobile</label><input id="m" value="'+esc(x?.mobile||'')+'"></div><div><label>Amount</label><input id="a" type="number" value="'+(x?.amount||'')+'"></div><div><label>Payment Mode</label><select id="pm"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select></div><div><label>Date</label><input id="dt" type="date" value="'+(x?.date||new Date().toISOString().slice(0,10))+'"></div><div><label>Status</label><select id="st"><option '+(x?.status==='Paid'?'selected':'')+'>Paid</option><option '+(x?.status==='Unpaid'?'selected':'')+'>Unpaid</option></select></div><div class="full"><label>Notes</label><textarea id="nt">'+esc(x?.notes||'')+'</textarea></div></div><p><b>Receipt:</b> '+(x?.receipt||'Auto generated')+'</p><button onclick="this.closest(\'.modal\').remove()">Cancel</button> <button class="p" onclick="saveIncome(\''+(id||'')+'\')">Save</button></div></div>');if(x)pm.value=x.mode||'Cash'}function receipt(name){let pre=(festival==='ganesh'?'GCM':'NRM')+year,parts=name.trim().split(/\s+/),init=((parts[0]?.[0]||'X')+(parts.at(-1)?.[0]||parts[0]?.[0]||'X')).toUpperCase(),max=data.income.reduce((n,x)=>{let m=(x.receipt||'').match(new RegExp('^'+pre+init+'(\\d+)$'));return Math.max(n,m?+m[1]:0)},0);return pre+init+String(max+1).padStart(2,'0')}async function saveIncome(id){let old=id?data.income.find(x=>x.id===id):null,name=n.value.trim(),amount=+a.value;if(!name||!amount)return toast('Name and amount required');let receiptNo=old?old.receipt:receipt(name),payload={event_id:eid(),full_name:name,mobile:m.value,amount,paid:st.value==='Paid',status:st.value,payment_method:pm.value,paid_date:st.value==='Paid'?dt.value:null,note:nt.value,created_by:user.id,receipt_number:receiptNo,festival_year:year};let r=old?await sb.from('income').update(payload).eq('id',id):await sb.from('income').insert(payload);if(r.error)return toast(r.error.message);await load();render()}function wa(id){let x=data.income.find(r=>r.id===id),p=(x.mobile||'').replace(/\D/g,'');if(p.length===10)p='91'+p;if(p.length<12)return toast('Enter valid 10 digit mobile');let title=(festival==='navratri'?'Navratri Mahotsav ':'Ganesh Mahotsav ')+year,close=festival==='navratri'?'જય માતાજી 🚩':'જય શ્રી ગણેશ 🚩',msg='🙏 *Bodka Yuva Sena*\n\n*'+title+'*\n\nનમસ્તે '+x.name+',\n\nતમારો *₹'+Number(x.amount).toLocaleString('en-IN')+'* નો ફાળો સફળતાપૂર્વક પ્રાપ્ત થયો છે. 🙏\n\n*રસીદ નંબર:* '+x.receipt+'\n*ચુકવણીનો પ્રકાર:* '+x.mode+'\n*તારીખ:* '+x.date+'\n\nઆપના અમૂલ્ય સહયોગ બદલ ખૂબ ખૂબ આભાર. 🙏\n\n*'+close+'*';window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}function expensePage(){page.innerHTML='<div class="card"><div class="top"><h2>Expenses</h2><button class="p" onclick="expenseModal()">＋ Add Expense</button></div><div style="overflow:auto"><table class="table"><tr><th>Category</th><th>Description</th><th>Paid To</th><th>Amount</th><th>Date</th><th>Action</th></tr>'+data.expenses.map(x=>'<tr><td>'+esc(x.cat)+'</td><td>'+esc(x.desc)+'</td><td>'+esc(x.paid)+'</td><td>'+money(x.amount)+'</td><td>'+x.date+'</td><td><button onclick="expenseModal(\''+x.id+'\')">Edit</button> <button class="d" onclick="delRec(\'expenses\',\''+x.id+'\')">Delete</button></td></tr>').join('')+'</table></div></div>'}function expenseModal(id){let x=id?data.expenses.find(r=>r.id===id):null;app.insertAdjacentHTML('beforeend','<div class="modal"><div class="box"><h2>'+(x?'Edit':'Add')+' Expense</h2><div class="form"><div><label>Category</label><input id="ec" value="'+esc(x?.cat||'')+'"></div><div><label>Description</label><input id="ed" value="'+esc(x?.desc||'')+'"></div><div><label>Amount</label><input id="ea" type="number" value="'+(x?.amount||'')+'"></div><div><label>Paid To</label><input id="ep" value="'+esc(x?.paid||'')+'"></div><div><label>Date</label><input id="ee" type="date" value="'+(x?.date||new Date().toISOString().slice(0,10))+'"></div><div class="full"><label>Notes</label><textarea id="en">'+esc(x?.notes||'')+'</textarea></div></div><button onclick="this.closest(\'.modal\').remove()">Cancel</button> <button class="p" onclick="saveExpense(\''+(id||'')+'\')">Save</button></div></div>')}async function saveExpense(id){let old=id?data.expenses.find(x=>x.id===id):null,p={event_id:eid(),category:ec.value.trim(),description:ed.value,amount:+ea.value,paid_by:ep.value,expense_date:ee.value,note:en.value,created_by:user.id,festival_year:year};if(!p.amount)return toast('Enter amount');let r=old?await sb.from('expenses').update(p).eq('id',id):await sb.from('expenses').insert(p);if(r.error)return toast(r.error.message);await load();render()}async function delRec(t,id){if(!confirm('Delete this record?'))return;let r=await sb.from(t).delete().eq('id',id);if(r.error)return toast(r.error.message);await load();render()}async function logout(){if(channel)await sb.removeChannel(channel);await sb.auth.signOut();user=null;festival=null;loginView()}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recoveryView()}});(async()=>{let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;chooseView()}else loginView()})();</script></body></html>
