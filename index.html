<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festival Management System</title>
<style>
:root{--p:#6d3fd1;--bg:#f6f4fb;--ink:#211b2d;--muted:#746d80;--card:#fff;--line:#e8e3ef;--green:#17845b;--red:#c33b4a;--shadow:0 10px 30px rgba(49,30,78,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#eadfff 0,#f6f4fb 45%,#f6f4fb 100%)}
.login-card{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.logo{width:48px;height:48px;border-radius:14px;background:var(--p);color:white;display:grid;place-items:center;font-size:24px;font-weight:800}
h1,h2,h3{margin:0 0 8px}.muted{color:var(--muted)}label{font-size:13px;font-weight:700;display:block;margin:14px 0 7px}
input,select,textarea{width:100%;border:1px solid #ddd6e8;border-radius:11px;padding:11px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #6d3fd120}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--p);color:#fff}.secondary{background:#f1edf8;color:var(--ink)}.danger{background:#fff0f1;color:var(--red)}.success{background:#e9f7f1;color:var(--green)}
.app{min-height:100vh;display:flex}.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 24px}.brand .logo{width:40px;height:40px;font-size:19px}.nav button{width:100%;text-align:left;background:transparent;border:0;padding:11px 12px;border-radius:10px;color:#5f586b;font-weight:650;margin:2px 0}.nav button.active,.nav button:hover{background:#f0ebfa;color:var(--p)}.main{margin-left:250px;width:calc(100% - 250px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}.content{padding:28px;max-width:1500px;margin:auto}.crumb{font-size:13px;color:var(--muted);margin-bottom:18px}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:800;margin-top:8px}.icon{font-size:22px}.festival-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px}.festival{min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.festival .emoji{font-size:48px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar .grow{flex:1;min-width:220px}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px 15px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#fbfafe;color:#625b6d;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.actions{display:flex;gap:6px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f0ebfa;color:var(--p);font-size:12px;font-weight:700}.empty{text-align:center;padding:50px;color:var(--muted)}
.chart{height:220px;display:flex;align-items:flex-end;gap:16px;padding:15px 5px}.bar-group{flex:1;height:100%;display:flex;gap:7px;align-items:flex-end;justify-content:center}.bar{width:28px;border-radius:8px 8px 3px 3px;min-height:5px}.income{background:#6d3fd1}.expense{background:#d9cbed}.legend{font-size:12px;color:var(--muted);display:flex;gap:16px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.modal{position:fixed;inset:0;background:#17121e99;display:grid;place-items:center;padding:20px;z-index:20}.modal-box{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;background:#211b2d;color:#fff;padding:12px 16px;border-radius:12px;z-index:50;box-shadow:var(--shadow)}
.mobile-menu{display:none}.top-user{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#eee7fa;color:var(--p);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.dash-split{grid-template-columns:1.5fr 1fr}
.side-overlay{display:none;position:fixed;inset:0;background:rgba(23,18,30,.5);z-index:4}.side-overlay.show{display:block}
h1{font-size:clamp(20px,5vw,28px)}
.table-wrap{-webkit-overflow-scrolling:touch}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.side{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}.dash-split{grid-template-columns:1fr}}
@media(max-width:720px){.side{transform:translateX(-100%);transition:.2s;width:250px;box-shadow:0 0 40px rgba(0,0,0,.15)}.side.open{transform:translateX(0)}.main{margin-left:0;width:100%}.mobile-menu{display:block}.top{min-height:64px;height:auto;padding:10px 16px;flex-wrap:wrap;row-gap:8px}.content{padding:16px 14px}.cards,.festival-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.top h2{font-size:17px}.table th,.table td{padding:10px 11px;font-size:13px}.card{padding:16px}.metric{font-size:24px}.festival .emoji{font-size:38px}.toolbar .grow{min-width:100%}}
@media(max-width:480px){.top-user .badge{display:none}.top-user{gap:6px}.top .btn{padding:8px 10px;font-size:13px}.login{padding:16px}.login-card{padding:22px}.modal-box{padding:16px;border-radius:16px}.toast{left:16px;right:16px;bottom:16px;text-align:center}.festival-grid{gap:14px}.festival{min-height:150px}.festival .emoji{font-size:32px}}
.org-logo{width:48px;height:48px;border-radius:14px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:4px}.brand .org-logo{width:40px;height:40px;border-radius:12px}.logo-preview{width:84px;height:84px;border-radius:16px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:8px}.logo-placeholder{width:84px;height:84px;border-radius:16px;background:#f0ebfa;border:1px dashed #c8bce0;display:grid;place-items:center;color:#756b82;font-size:11px;text-align:center;padding:8px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='fms_standalone_v4_bodka_fresh';
const seed={
  user:null, org:'bodka', festival:null, year:2026,
  orgs:{bodka:{name:'Bodka Yuva Sena',plan:'Pro',status:'Active',logo:''}},
  data:{bodka:{ganesh:{2026:{income:[],expenses:[]}},navratri:{2026:{income:[],expenses:[]}}}},
  logs:[]
};

let state;
try {
  state = JSON.parse(localStorage.getItem(KEY));
  if (!state || !state.orgs || !state.data) {
    state = seed;
    localStorage.setItem(KEY, JSON.stringify(seed));
  }
} catch(e) {
  state = seed;
  localStorage.setItem(KEY, JSON.stringify(seed));
}

const $=id=>document.getElementById(id);

const SB_URL='https://ztvkybdluwtsxopmpwxq.supabase.co';
const SB_KEY='sb_publishable_CwxipNGfHRYaaTkvGkh_GQ_jo-n4oc0';
const ADMIN_EMAIL='pinakinpatel29092000@gmail.com';
const APP_STATE_ID='bodka-yuva-sena';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let currentAuthUser=null, currentProfile={role:'admin',name:'Mandal Admin'};
let isHydrating=false, saveTimer=null, persistChain=Promise.resolve(), realtimeChannel=null;
const CLIENT_ID=localStorage.getItem('bodka_yuva_sena_client_id') || (()=>{const v=crypto.randomUUID();localStorage.setItem('bodka_yuva_sena_client_id',v);return v;})();
function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  if(currentAuthUser && !isHydrating){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{saveTimer=null;persistSharedState();},350);
  }
}
function sharedSnapshot(){
  const copy=JSON.parse(JSON.stringify(state));
  copy.user=null;
  return copy;
}
function persistSharedStateNow(){
  if(!currentAuthUser)return Promise.resolve();
  const row={id:APP_STATE_ID,payload:sharedSnapshot(),updated_by:currentAuthUser.id,client_id:CLIENT_ID,updated_at:new Date().toISOString()};
  persistChain=persistChain.then(async()=>{
    const {error}=await sb.from('app_state').upsert(row,{onConflict:'id'});
    if(error){console.error('Shared save failed',error);toast('Online save failed: '+error.message);throw error;}
    console.info('Bodka shared database save successful',row.updated_at);
  }).catch(err=>{console.error(err);});
  return persistChain;
}
function persistSharedState(){
  if(!currentAuthUser || isHydrating)return;
  persistSharedStateNow();
}
function ensureStateShape(){
  if(!state || !state.orgs || !state.data)state=JSON.parse(JSON.stringify(seed));
  if(!state.orgs.bodka)state.orgs.bodka={name:'Bodka Yuva Sena',plan:'Pro',status:'Active',logo:''};
  if(!state.data.bodka)state.data.bodka={ganesh:{2026:{income:[],expenses:[]}},navratri:{2026:{income:[],expenses:[]}}};
  if(!state.data.bodka.ganesh)state.data.bodka.ganesh={2026:{income:[],expenses:[]}};
  if(!state.data.bodka.navratri)state.data.bodka.navratri={2026:{income:[],expenses:[]}};
  if(!Array.isArray(state.logs))state.logs=[];
  if(!state.year)state.year=2026;
  if(!state.org)state.org='bodka';
}
async function hydrateSharedState(user){
  isHydrating=true;
  currentAuthUser=user;
  const {data:profile,error:profileError}=await sb.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
  if(profileError)throw profileError;
  currentProfile={role:profile?.role==='viewer'?'viewer':'admin',name:profile?.full_name||'Mandal Admin'};
  const {data:remote,error}=await sb.from('app_state').select('payload,updated_at,client_id').eq('id',APP_STATE_ID).maybeSingle();
  if(error)throw error;
  if(remote && remote.payload){
    state=remote.payload;
    ensureStateShape();
    state.user={role:currentProfile.role,name:currentProfile.name};
    localStorage.setItem(KEY,JSON.stringify(state));
  }else{
    ensureStateShape();
    state.user={role:currentProfile.role,name:currentProfile.name};
    await persistSharedStateNow();
  }
  isHydrating=false;
  render();
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('bodka-yuva-sena-shared-state')
    .on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'id=eq.'+APP_STATE_ID},payload=>{
      if(!payload.new || payload.new.client_id===CLIENT_ID || !payload.new.payload || saveTimer!==null)return;
      isHydrating=true;
      state=payload.new.payload;
      ensureStateShape();
      state.user={role:currentProfile.role,name:currentProfile.name};
      localStorage.setItem(KEY,JSON.stringify(state));
      isHydrating=false;
      render();
      toast('Data synced from another device');
    }).subscribe();
}
async function initializeSharedApp(){
  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(data.session)await hydrateSharedState(data.session.user);
    else render();
  }catch(err){console.error(err);currentAuthUser=null;isHydrating=false;render();toast('Could not connect to online database. Please sign in again.');}
}

function orgLogo(){let l=state.orgs[state.org]?.logo;return l ? '<img src="'+l+'" class="org-logo" alt="Organization Logo">' : '<div class="logo">🪔</div>'}
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n)}
function cur(){
  if(!state.data[state.org]) state.data[state.org]={ganesh:{2026:{income:[],expenses:[]}},navratri:{2026:{income:[],expenses:[]}}};
  if(!state.data[state.org][state.festival]) state.data[state.org][state.festival]={};
  if(!state.data[state.org][state.festival][state.year]) state.data[state.org][state.festival][state.year]={income:[],expenses:[]};
  return state.data[state.org][state.festival][state.year];
}
function log(action){state.logs.unshift({user:state.user?.name||'Admin',action,date:new Date().toLocaleString('en-IN')});state.logs=state.logs.slice(0,100);save()}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

// Backup Export & Import Functions
function exportBackup(){
  let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
  let dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "fms_backup_" + new Date().toISOString().slice(0,10) + ".json");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
  toast('Backup file downloaded successfully!');
}

function importBackup(event){
  let file = event.target.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(e){
    try {
      let imported = JSON.parse(e.target.result);
      if(imported && imported.orgs && imported.data){
        state = imported;
        save();
        render();
        toast('Backup imported successfully!');
      } else {
        toast('Invalid backup file structure!');
      }
    } catch(err){
      toast('Error reading backup file!');
    }
  };
  reader.readAsText(file);
}

function render(){
  try {
    state.user?renderApp():renderLogin();
  } catch(err) {
    console.error(err);
    document.body.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>Something went wrong.</h2><p>Clearing cache...</p><button onclick="localStorage.removeItem(\''+KEY+'\');location.reload()">Reset App</button></div>';
  }
}
function renderLogin(){
 $('root').innerHTML='<div class="login"><div class="login-card">'
 +orgLogo()+'<div style="height:18px"></div><h1>Festival Management System</h1><p class="muted">Secure accounting & management for Bodka Yuva Sena</p>'
 +'<label>Account</label><input value="Bodka Yuva Sena — Admin" readonly>'
 +'<label>Password</label><input id="pass" type="password" placeholder="Enter password">'
 +'<button class="btn primary" style="width:100%;margin-top:18px" onclick="login()">Sign in</button>'
 +'<button class="btn secondary" style="width:100%;margin-top:8px" onclick="forgotPassword()">Forgot Password?</button>'
 +'<p class="muted" style="font-size:12px;margin-top:16px">Secure online admin login</p>'
 +'</div></div>';
}
async function login(){
  const p=$('pass')?.value||'';
  if(!p)return toast('Please enter your password');
  const btn=document.querySelector('.login-card .primary');if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:p});
    if(error)throw error;
    await hydrateSharedState(data.user);
    toast('Login successful');
  }catch(err){
    console.error(err);currentAuthUser=null;isHydrating=false;
    if(btn){btn.disabled=false;btn.textContent='Sign in';}
    toast('Login/database error: '+(err.message||'Please try again'));
  }
}
async function forgotPassword(){
  try{
    const {error}=await sb.auth.resetPasswordForEmail(ADMIN_EMAIL,{redirectTo:window.location.origin});
    if(error)throw error;
    toast('Password reset email sent');
  }catch(err){toast('Reset email error: '+(err.message||'Please try again'));}
}

function renderApp(){
 if(state.user.role==='super')return renderSuper();
 if(!state.festival)return renderFestival();
 $('root').innerHTML='<div class="app"><aside class="side" id="side">'+sidebar()+'</aside><div class="side-overlay" id="sideOverlay" onclick="closeSide()"></div><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="btn secondary mobile-menu" onclick="toggleSide()">☰</button><div><h2>'+state.orgs[state.org].name+'</h2><div class="muted" style="font-size:12px">'+cap(state.festival)+' · '+state.year+'</div></div></div><div class="top-user"><span class="badge">'+(state.user.role==='viewer'?'Viewer':'Admin')+'</span><div class="avatar">'+state.user.name[0]+'</div><button class="btn secondary" onclick="logout()">Logout</button></div></header><section class="content" id="page"></section></main></div>';
 dashboard();
}
function cap(s){return s==='ganesh'?'Ganesh Chaturthi':'Navratri'}
async function logout(){
  currentAuthUser=null;
  if(realtimeChannel){await sb.removeChannel(realtimeChannel);realtimeChannel=null;}
  state.user=null;localStorage.setItem(KEY,JSON.stringify(state));render();
  const {error}=await sb.auth.signOut();if(error)console.error(error);
}
function toggleSide(){let s=$('side'),o=$('sideOverlay');if(!s)return;let opening=!s.classList.contains('open');s.classList.toggle('open');o?.classList.toggle('show');document.body.style.overflow=opening?'hidden':''}
function closeSide(){$('side')?.classList.remove('open');$('sideOverlay')?.classList.remove('show');document.body.style.overflow=''}
function sidebar(){let items=[['dashboard','Dashboard'],['years','Years'],['income','Income / Fado'],['expenses','Expenses'],['contributors','Contributors'],['reports','Reports'],['activity','Activity Log']];if(state.user.role==='admin')items.push(['settings','Settings']);return '<div class="brand">'+orgLogo()+'<div><b>Festival Management</b><div class="muted" style="font-size:11px">Mandal SaaS</div></div></div><div class="nav">'+items.map(x=>'<button onclick="nav(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div style="position:absolute;bottom:18px;left:14px;right:14px"><button class="btn secondary" style="width:100%" onclick="state.festival=null;render()">← Change Festival</button></div>'}
function dashboard(){let c=cur(),inc=c.income.reduce((a,x)=>a+x.amount,0),exp=c.expenses.reduce((a,x)=>a+x.amount,0);$('page').innerHTML='<div class="crumb">Home / '+cap(state.festival)+' / '+state.year+'</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>Dashboard</h1><p class="muted">Festival accounting overview (With Carry Forward)</p></div></div><div class="grid cards" style="margin-top:20px"><div class="card"><div class="icon">💰</div><div class="muted">Total Income / Fado</div><div class="metric">'+money(inc)+'</div></div><div class="card"><div class="icon">🧾</div><div class="muted">Total Expenses</div><div class="metric">'+money(exp)+'</div></div><div class="card"><div class="icon">📊</div><div class="muted">Current Balance</div><div class="metric">'+money(inc-exp)+'</div></div><div class="card"><div class="icon">👥</div><div class="muted">Contributors</div><div class="metric">'+new Set(c.income.map(x=>x.name)).size+'</div></div></div><div class="grid dash-split" style="margin-top:18px"><div class="card"><h3>Recent Transactions</h3>'+transactions(c)+'</div><div class="card"><h3>Income vs Expense</h3><div class="chart"><div class="bar-group"><div class="bar income" style="height:'+Math.min(100,inc/(Math.max(inc,exp)||1)*100)+'%"></div><div class="bar expense" style="height:'+Math.min(100,exp/(Math.max(inc,exp)||1)*100)+'%"></div></div></div><div class="legend"><span><i class="dot income"></i>Income</span><span><i class="dot expense"></i>Expense</span></div></div></div>';}
function transactions(c){let rows=[...c.income.map(x=>({...x,type:'Income'})),...c.expenses.map(x=>({...x,type:'Expense',name:x.desc,mode:x.mode}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);return '<div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th><th>Mode</th>'+(state.user.role==='admin'?'<th>Action</th>':'')+'</tr></thead><tbody>'+rows.map(x=>'<tr><td>'+x.date+'</td><td>'+x.name+'</td><td><span class="badge">'+x.type+'</span></td><td>'+money(x.amount)+'</td><td>'+x.mode+'</td>'+(state.user.role==='admin'?'<td><button class="btn secondary" onclick="edit(\''+x.type+'\','+x.id+')">Edit</button></td>':'')+'</tr>').join('')+'</tbody></table></div>';}
function nav(n){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let map={dashboard,years,income:incomePage,expenses:expensePage,contributors,reports,activity,settings};map[n]?.();closeSide()}
function years(){
 let yearObj=state.data[state.org][state.festival]||{};
 let yearList=Object.keys(yearObj).map(Number).filter(y=>Number.isInteger(y)&&y>=2000&&y<=2100).sort((a,b)=>b-a);
 if(!yearList.length){yearList=[2026];yearObj[2026]={income:[],expenses:[]};save();}
 $('page').innerHTML='<div class="crumb">Festival / Years</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>Years & Carry Forward</h1><p class="muted">Manage independent year-wise accounting with automatic balance carry forward</p></div>'+(state.user.role==='admin'?'<button class="btn primary" id="addYearBtn">＋ Add Year (With Carry Forward)</button>':'')+'</div><div class="grid cards" style="margin-top:20px">'+yearList.map((y,i)=>{let d=yearObj[y]||{income:[],expenses:[]};let iTotal=d.income.reduce((a,x)=>a+Number(x.amount||0),0);let eTotal=d.expenses.reduce((a,x)=>a+Number(x.amount||0),0);let bal=iTotal-eTotal;return '<div class="card"><span class="badge">'+(state.year===y?'Current Active Year':'Year')+'</span><h2 style="margin-top:16px">'+y+'</h2><p class="muted">Income: '+money(iTotal)+'<br>Expenses: '+money(eTotal)+'<br><b>Net Balance: '+money(bal)+'</b></p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn '+(state.year===y?'primary':'secondary')+'" data-open-year="'+y+'">'+(state.year===y?'Opened':'Open '+y)+'</button>'+(state.user.role==='admin'?'<button type="button" class="btn danger year-delete-btn" data-year-delete="'+y+'">Delete</button>':'')+'</div></div>'}).join('')+'</div>';
 $('addYearBtn')?.addEventListener('click',openYearModal);
 document.querySelectorAll('[data-open-year]').forEach(btn=>btn.addEventListener('click',()=>openYear(Number(btn.dataset.openYear))));
 document.querySelectorAll('[data-year-delete]').forEach(btn=>btn.addEventListener('click',()=>window.deleteYear(Number(btn.dataset.yearDelete))));
}
function openYear(y){let yNum=Number(y);let obj=state.data[state.org][state.festival];if(!obj[yNum])obj[yNum]={income:[],expenses:[]};state.year=yNum;save();renderApp();toast('Year '+yNum+' opened');}
window.deleteYear=function(y){
 let yNum=Number(y);
 let festivalData=state.data?.[state.org]?.[state.festival];
 if(!festivalData || !Object.prototype.hasOwnProperty.call(festivalData,yNum)){toast('Year not found');return;}
 let d=festivalData[yNum]||{income:[],expenses:[]};
 let incomeCount=(d.income||[]).length, expenseCount=(d.expenses||[]).length;
 if(!window.confirm('Delete '+yNum+'?\n\nThis will permanently delete this year and its '+incomeCount+' income/fado and '+expenseCount+' expense record(s).')) return;
 delete festivalData[yNum];
 let remaining=Object.keys(festivalData).map(Number).filter(v=>Number.isInteger(v)&&v>=2000&&v<=2100).sort((a,b)=>b-a);
 if(remaining.length===0){festivalData[2026]={income:[],expenses:[]};remaining=[2026];}
 if(Number(state.year)===yNum) state.year=remaining[0];
 save();
 renderApp();
 toast('Year '+yNum+' deleted successfully');
};
function openYearModal(){
 $('modal')?.remove();
 let existing=Object.keys(state.data[state.org][state.festival]).map(Number);
 let maxYear=existing.length?Math.max(...existing):2026;
 let recYear=maxYear+1;
 
 let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Add New Year with Carry Forward</h2><button class="btn secondary" onclick="$(\'modal\').remove()">✕</button></div><p class="muted">Add a new year. The remaining balance (Closing Balance) from the previous year will automatically be added as an <b>Opening Balance</b> to the new year!</p><label>New Year</label><input id="newyear" type="number" min="2000" max="2100" value="'+recYear+'"><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn secondary" onclick="$(\'modal\').remove()">Cancel</button><button class="btn primary" onclick="addYearWithCarryForward()">Create Year & Carry Forward Balance</button></div></div>';document.body.appendChild(m);setTimeout(()=>$('newyear')?.focus(),50);
}
function addYearWithCarryForward(){
 let raw=$('newyear')?.value?.trim();let y=Number(raw);
 if(!raw||!Number.isInteger(y)||y<2000||y>2100)return toast('Please enter a valid year between 2000 and 2100');
 let obj=state.data[state.org][state.festival];
 if(obj[y])return toast('This year already exists');

 let prevYear=y-1;
 let prevData=obj[prevYear];
 let carryAmount=0;
 if(prevData){
   let pInc=(prevData.income||[]).reduce((a,x)=>a+Number(x.amount||0),0);
   let pExp=(prevData.expenses||[]).reduce((a,x)=>a+Number(x.amount||0),0);
   carryAmount=pInc-pExp;
 }

 obj[y]={income:[],expenses:[]};
 
 if(carryAmount>0){
   obj[y].income.push({
     id: Date.now(),
     name: 'Opening Balance (Carry Forward from '+prevYear+')',
     mobile: '-',
     amount: carryAmount,
     mode: 'Bank Transfer',
     date: y+'-01-01',
     receipt: 'CF-'+y,
     notes: 'Automatic carry forward from previous year closing balance'
   });
 }

 state.year=y;
 save();
 log('Created '+y+' year with carry forward '+(carryAmount>0?money(carryAmount):'₹0'));
 $('modal')?.remove();
 renderApp();
 toast('Year '+y+' added! Carry forward: '+money(carryAmount));
}
function incomePage(){let c=cur();$('page').innerHTML='<div class="crumb">Festival / Income</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>Income / Fado</h1><p class="muted">Total: <b>'+money(c.income.reduce((a,x)=>a+x.amount,0))+'</b> (Includes Carry Forward if any)</p></div>'+(state.user.role==='admin'?'<button class="btn primary" onclick="openModal(\'income\')">＋ Add Income</button>':'')+'</div><div class="toolbar"><input class="grow" id="isearch" placeholder="Search contributor..." oninput="incomeTable()"><select id="imode" onchange="incomeTable()"><option value="">All payment modes</option><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select></div><div id="itable"></div>';incomeTable()}

function expenseTable(){let q=($('esearch')?.value||'').toLowerCase(),m=$('ecat')?.value||'',arr=cur().expenses.filter(x=>(x.desc+' '+x.paid).toLowerCase().includes(q)&&(!m||x.cat===m));$('etable').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th>Description</th><th>Paid To</th><th>Amount</th><th>Mode</th><th>Date</th>'+(state.user.role==='admin'?'<th>Action</th>':'')+'</tr></thead><tbody>'+arr.map(x=>'<tr><td><span class="badge">'+x.cat+'</span></td><td>'+x.desc+'</td><td>'+x.paid+'</td><td><b>'+money(x.amount)+'</b></td><td>'+x.mode+'</td><td>'+x.date+'</td>'+(state.user.role==='admin'?'<td class="actions"><button class="btn secondary" onclick="edit(\'Expense\','+x.id+')">Edit</button><button class="btn danger" onclick="del(\'expenses\','+x.id+')">Delete</button></td>':'')+'</tr>').join('')+'</tbody></table></div>'}
function contributors(){let map={};cur().income.forEach(x=>{map[x.name]??={name:x.name,mobile:x.mobile,total:0,count:0,last:''};map[x.name].total+=x.amount;map[x.name].count++;map[x.name].last=map[x.name].last>x.date?map[x.name].last:x.date});let a=Object.values(map);$('page').innerHTML='<div class="crumb">Festival / Contributors</div><h1>Contributors</h1><p class="muted">Contribution history is isolated to the selected festival and year.</p><div class="table-wrap" style="margin-top:18px"><table class="table"><thead><tr><th>Name</th><th>Mobile</th><th>Total Contribution</th><th>Contributions</th><th>Last Contribution</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+x.name+'</b></td><td>'+x.mobile+'</td><td>'+money(x.total)+'</td><td>'+x.count+'</td><td>'+x.last+'</td></tr>').join('')+'</tbody></table></div>'}
function reports(){let c=cur(),inc=c.income.reduce((a,x)=>a+x.amount,0),exp=c.expenses.reduce((a,x)=>a+x.amount,0);$('page').innerHTML='<div class="crumb">Festival / Reports</div><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Reports</h1><p class="muted">'+cap(state.festival)+' · '+state.year+'</p></div><button class="btn secondary" onclick="window.print()">Export / Print Report</button></div><div class="grid cards" style="margin-top:18px"><div class="card"><div class="muted">Income</div><div class="metric">'+money(inc)+'</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">'+money(exp)+'</div></div><div class="card"><div class="muted">Balance</div><div class="metric">'+money(inc-exp)+'</div></div><div class="card"><div class="muted">Transactions</div><div class="metric">'+(c.income.length+c.expenses.length)+'</div></div></div><div class="card" style="margin-top:18px"><h3>Year Comparison (With Carry Forward)</h3><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Year</th><th>Income</th><th>Expense</th><th>Closing Balance</th></tr></thead><tbody>'+Object.keys(state.data[state.org][state.festival]||{}).map(Number).filter(y=>Number.isInteger(y)).sort((a,b)=>b-a).map(y=>{let d=state.data[state.org][state.festival][y]||{income:[],expenses:[]};let i=d.income.reduce((a,x)=>a+x.amount,0),e=d.expenses.reduce((a,x)=>a+x.amount,0);return '<tr><td>'+y+'</td><td>'+money(i)+'</td><td>'+money(e)+'</td><td><b>'+money(i-e)+'</b></td></tr>'}).join('')+'</tbody></table></div></div>';}

function uploadOrgLogo(input){let file=input.files&&input.files[0];if(!file)return;if(file.size>2*1024*1024)return toast('Logo must be 2MB or smaller');if(!file.type.startsWith('image/'))return toast('Please select an image file');let r=new FileReader();r.onload=function(e){state.orgs[state.org].logo=e.target.result;save();log('Updated organization logo');renderApp();toast('Organization logo saved successfully')};r.readAsDataURL(file)}

function openModal(type,item){
  const editing=!!item;
  const income=type.toLowerCase()==='income';
  const d=editing ? (income ? cur().income.find(x=>x.id===item) : cur().expenses.find(x=>x.id===item)) : null;

      +'<div><label>Amount</label><input id="mamount" type="number" value="'+(d?.amount||'')+'"></div>'
      +'<div><label>Paid To</label><input id="mpaid" value="'+(d?.paid||'')+'"></div>'
      +'<div><label>Payment Mode</label><select id="mmode">'+modeOptions+'</select></div>'
      +'<div><label>Date</label><input id="mdate" type="date" value="'+(d?.date||new Date().toISOString().slice(0,10))+'"></div>'
      +'<div><label>Bill/Receipt Number</label><input id="mreceipt" value="'+(d?.receipt||'')+'"></div>'
      +'<div class="full"><label>Notes</label><textarea id="mnotes">'+(d?.notes||'')+'</textarea></div>';
  const modal='<div class="modal" id="modal"><div class="modal-box">'

  $('root').insertAdjacentHTML('beforeend',modal);
}
function receiptPrefix(){
  return state.festival==='ganesh' ? 'GCM' : 'NRM';
}
function receiptInitials(name){
  let parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return 'XX';
  let first=parts[0][0]||'X';
  let last=parts.length>1 ? parts[parts.length-1][0] : first;
  return (first+last).toUpperCase();
}
function nextReceiptNumber(name){
  let arr=cur().income||[];
  let prefix=receiptPrefix()+String(state.year);
  let max=0;
  arr.forEach(x=>{
    let m=String(x.receipt||'').match(new RegExp('^'+prefix+'[A-Z]{2}(\\d+)$','i'));
    if(m) max=Math.max(max,Number(m[1])||0);
  });
  return prefix+receiptInitials(name)+String(max+1).padStart(2,'0');
}
function sendWhatsAppReceipt(id){
  let x=cur().income.find(r=>r.id===id);
  if(!x) return toast('Receipt record not found');
  let phone=String(x.mobile||'').replace(/\D/g,'');
  if(phone.length===10) phone='91'+phone;
  if(phone.length<12) return toast('Please enter a valid 10-digit mobile number');
  let mandal=state.orgs[state.org]?.name||'Mandal';
  let isNavratri=state.festival==='navratri';
  let festivalTitle=(isNavratri?'Navratri Mahotsav ':'Ganesh Mahotsav ')+state.year;
  let closing=isNavratri?'જય માતાજી 🚩':'જય શ્રી ગણેશ 🚩';
  let message='🙏 *'+mandal+'*\n\n*'+festivalTitle+'*\n\nનમસ્તે '+x.name+',\n\nતમારો *₹'+Number(x.amount).toLocaleString('en-IN')+'* નો ફાળો સફળતાપૂર્વક પ્રાપ્ત થયો છે. 🙏\n\n*રસીદ નંબર:* '+x.receipt+'\n*ચુકવણીનો પ્રકાર:* '+x.mode+'\n*તારીખ:* '+x.date+'\n\nBodka Yuva Sena તરફથી આપના અમૂલ્ય સહયોગ બદલ ખૂબ ખૂબ આભાર. 🙏\n\n*'+closing+'*';
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(message),'_blank');
}
function saveModal(kind,id){let arr=cur()[kind],editing=id?arr.find(x=>x.id===id):null,amount=Number($('mamount').value||0);if(!amount)return toast('Enter an amount');let obj=kind==='income'?{id:id||Date.now(),name:$('mname').value,mobile:$('mmobile').value,amount,mode:$('mmode').value,date:$('mdate').value,receipt:editing?(editing.receipt||$('mreceipt').value):nextReceiptNumber($('mname').value),notes:$('mnotes').value}:{id:id||Date.now(),cat:$('mcat').value,desc:$('mdesc').value,amount,paid:$('mpaid').value,mode:$('mmode').value,date:$('mdate').value,receipt:$('mreceipt').value,notes:$('mnotes').value};if(editing){let old=editing.amount;Object.assign(editing,obj);log(`Edited ${kind==='income'?'income':'expense'} ${money(old)} → ${money(amount)}`)}else{arr.unshift(obj);log(`Added ${kind==='income'?'income':'expense'} ${money(amount)}`)}save();$('modal').remove();kind==='income'?incomePage():expensePage();toast(editing?'Updated successfully':'Added successfully')}
function edit(type,id){openModal(type,id)}
function del(kind,id){if(!confirm('Delete this record? This action cannot be undone.'))return;let a=cur()[kind],i=a.findIndex(x=>x.id===id),old=a[i];if(i>=0){a.splice(i,1);log(`Deleted ${kind==='income'?'income':'expense'} ${money(old.amount)}`);save();kind==='income'?incomePage():expensePage();toast('Deleted')}}

initializeSharedApp();
